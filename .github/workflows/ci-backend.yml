name: CI backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: c216_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d c216_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/c216_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/c216_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar Poetry
        run: python -m pip install "poetry==2.4.1"
      - name: Instalar dependências
        run: poetry install --no-interaction --no-ansi
      - name: Verificar código
        run: poetry run ruff check .
      - name: Aplicar migrations
        run: poetry run alembic upgrade head
      - name: Verificar modelos e migrations
        run: poetry run alembic check
      - name: Executar testes unitários
        run: poetry run pytest tests/unit
      - name: Executar testes de integração
        run: poetry run pytest tests/integration
